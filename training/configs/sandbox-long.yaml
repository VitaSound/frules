# Long 0.5B — repeated small set + many epochs (loss still falling → keep going)
model: Qwen/Qwen2.5-Coder-0.5B-Instruct
dataset: data/train-repeated.jsonl
output_dir: output/sandbox-adapter-long
repeat: 5
base_dataset: data/train-simple.jsonl
lora_rank: 8
lora_alpha: 16
learning_rate: 2.0e-4
num_epochs: 10
max_seq_length: 1024
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
quantization: 4bit
